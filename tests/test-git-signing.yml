name: Test GPG key import with git signing config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test GPG key
        run: |
          cat > /tmp/gpg-key-params <<EOF
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Git Signer
          Name-Email: gitsigner@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-key-params
          FINGERPRINT=$(gpg --list-keys --with-colons gitsigner@example.com | grep '^fpr' | head -1 | cut -d: -f10)
          gpg --armor --export-secret-keys "$FINGERPRINT" > /tmp/test-private-key.asc
          echo "GPG_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-private-key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: import_gpg
        uses: .
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          git_config_global: 'true'
          git_user_signingkey: 'true'
          git_commit_gpgsign: 'true'
          git_tag_gpgsign: 'true'
          git_committer_name: 'Git Signer'
          git_committer_email: 'gitsigner@example.com'

      - name: Assert fingerprint output is set
        env:
          FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          echo "fingerprint: $FINGERPRINT"
          if [ -z "$FINGERPRINT" ]; then
            echo "FAIL: fingerprint output is empty"
            exit 1
          fi
          echo "PASS: fingerprint is set"

      - name: Assert git signing key is configured
        env:
          KEYID: ${{ steps.import_gpg.outputs.keyid }}
        run: |
          echo "keyid: $KEYID"
          if [ -z "$KEYID" ]; then
            echo "FAIL: keyid output is empty"
            exit 1
          fi
          # Check that git is configured to use the signing key
          CONFIGURED_KEY=$(git config --global user.signingkey 2>/dev/null || echo "")
          echo "configured git signing key: $CONFIGURED_KEY"
          if [ -z "$CONFIGURED_KEY" ]; then
            echo "FAIL: git user.signingkey is not configured"
            exit 1
          fi
          echo "PASS: git signing key is configured"

      - name: Assert git commit gpgsign is configured
        run: |
          GPGSIGN=$(git config --global commit.gpgsign 2>/dev/null || echo "")
          echo "commit.gpgsign: $GPGSIGN"
          if [ "$GPGSIGN" != "true" ]; then
            echo "FAIL: commit.gpgsign is not set to true, got '$GPGSIGN'"
            exit 1
          fi
          echo "PASS: commit.gpgsign is true"

      - name: Assert git tag gpgsign is configured
        run: |
          TAGSIGN=$(git config --global tag.gpgsign 2>/dev/null || echo "")
          echo "tag.gpgsign: $TAGSIGN"
          if [ "$TAGSIGN" != "true" ]; then
            echo "FAIL: tag.gpgsign is not set to true, got '$TAGSIGN'"
            exit 1
          fi
          echo "PASS: tag.gpgsign is true"

      - name: Assert git committer name is configured
        run: |
          NAME=$(git config --global user.name 2>/dev/null || echo "")
          echo "user.name: $NAME"
          if [ "$NAME" != "Git Signer" ]; then
            echo "FAIL: user.name is not 'Git Signer', got '$NAME'"
            exit 1
          fi
          echo "PASS: user.name is correct"

      - name: Assert git committer email is configured
        run: |
          EMAIL=$(git config --global user.email 2>/dev/null || echo "")
          echo "user.email: $EMAIL"
          if [ "$EMAIL" != "gitsigner@example.com" ]; then
            echo "FAIL: user.email is not 'gitsigner@example.com', got '$EMAIL'"
            exit 1
          fi
          echo "PASS: user.email is correct"
