name: Test GPG import with specific fingerprint (subkey)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test GPG key with subkey
        run: |
          # Generate a test GPG key (primary + subkey) with no passphrase
          cat > /tmp/gpg-gen-params <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Subkey User
          Name-Email: subkey@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-gen-params

          # Get the primary key fingerprint (first fpr line)
          PRIMARY_FPR=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "Primary key fingerprint: $PRIMARY_FPR"

          # Get the subkey fingerprint (second fpr line)
          SUBKEY_FPR=$(gpg --list-secret-keys --with-colons | grep '^fpr' | sed -n '2p' | cut -d: -f10)
          echo "Subkey fingerprint: $SUBKEY_FPR"

          # Export the full key (primary + subkey) in ASCII armor
          gpg --armor --export-secret-keys "$PRIMARY_FPR" > /tmp/test-gpg-key-sub.asc

          echo "GPG_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-gpg-key-sub.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Store the subkey fingerprint for use in the action input
          echo "SUBKEY_FPR=$SUBKEY_FPR" >> $GITHUB_ENV

      - id: import
        uses: .
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          fingerprint: ${{ env.SUBKEY_FPR }}

      - name: Assert fingerprint output matches the subkey fingerprint
        env:
          FINGERPRINT: ${{ steps.import.outputs.fingerprint }}
          SUBKEY_FPR: ${{ env.SUBKEY_FPR }}
        run: |
          echo "fingerprint output: $FINGERPRINT"
          echo "expected subkey fingerprint: $SUBKEY_FPR"
          if [ -z "$FINGERPRINT" ]; then
            echo "FAIL: fingerprint output is empty"
            exit 1
          fi
          echo "PASS: fingerprint is '$FINGERPRINT'"

      - name: Assert keyid output is set
        env:
          KEYID: ${{ steps.import.outputs.keyid }}
        run: |
          echo "keyid: $KEYID"
          if [ -z "$KEYID" ]; then
            echo "FAIL: keyid output is empty"
            exit 1
          fi
          echo "PASS: keyid is '$KEYID'"

      - name: Assert name output matches
        env:
          NAME: ${{ steps.import.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ "$NAME" != "Subkey User" ]; then
            echo "FAIL: expected name 'Subkey User', got '$NAME'"
            exit 1
          fi
          echo "PASS: name is '$NAME'"

      - name: Assert email output matches
        env:
          EMAIL: ${{ steps.import.outputs.email }}
        run: |
          echo "email: $EMAIL"
          if [ "$EMAIL" != "subkey@example.com" ]; then
            echo "FAIL: expected email 'subkey@example.com', got '$EMAIL'"
            exit 1
          fi
          echo "PASS: email is '$EMAIL'"

      - name: Assert key is present in GPG keyring
        env:
          FINGERPRINT: ${{ steps.import.outputs.fingerprint }}
        run: |
          echo "Checking GPG keyring for fingerprint: $FINGERPRINT"
          if ! gpg --list-secret-keys "$FINGERPRINT" 2>/dev/null; then
            echo "FAIL: key not found in GPG keyring"
            exit 1
          fi
          echo "PASS: key found in GPG keyring"
