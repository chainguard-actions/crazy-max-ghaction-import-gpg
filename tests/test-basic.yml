name: Test basic GPG import
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test GPG key (no passphrase)
        run: |
          # Generate a test GPG key with no passphrase
          cat > /tmp/gpg-gen-params <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Test User
          Name-Email: test@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-gen-params
          # Export the key in ASCII armor
          FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "Generated key fingerprint: $FINGERPRINT"
          gpg --armor --export-secret-keys "$FINGERPRINT" > /tmp/test-gpg-key.asc
          echo "GPG_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-gpg-key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: import
        uses: .
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}

      - name: Assert fingerprint output is set
        env:
          FINGERPRINT: ${{ steps.import.outputs.fingerprint }}
        run: |
          echo "fingerprint: $FINGERPRINT"
          if [ -z "$FINGERPRINT" ]; then
            echo "FAIL: fingerprint output is empty"
            exit 1
          fi
          echo "PASS: fingerprint is '$FINGERPRINT'"

      - name: Assert keyid output is set
        env:
          KEYID: ${{ steps.import.outputs.keyid }}
        run: |
          echo "keyid: $KEYID"
          if [ -z "$KEYID" ]; then
            echo "FAIL: keyid output is empty"
            exit 1
          fi
          echo "PASS: keyid is '$KEYID'"

      - name: Assert name output is set
        env:
          NAME: ${{ steps.import.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ "$NAME" != "Test User" ]; then
            echo "FAIL: expected name 'Test User', got '$NAME'"
            exit 1
          fi
          echo "PASS: name is '$NAME'"

      - name: Assert email output is set
        env:
          EMAIL: ${{ steps.import.outputs.email }}
        run: |
          echo "email: $EMAIL"
          if [ "$EMAIL" != "test@example.com" ]; then
            echo "FAIL: expected email 'test@example.com', got '$EMAIL'"
            exit 1
          fi
          echo "PASS: email is '$EMAIL'"

      - name: Assert key is importable in GPG keyring
        env:
          FINGERPRINT: ${{ steps.import.outputs.fingerprint }}
        run: |
          echo "Checking GPG keyring for fingerprint: $FINGERPRINT"
          if ! gpg --list-secret-keys "$FINGERPRINT" 2>/dev/null; then
            echo "FAIL: key not found in GPG keyring"
            exit 1
          fi
          echo "PASS: key found in GPG keyring"
