name: Test basic GPG key import
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test GPG key
        id: gen_key
        run: |
          # Generate a GPG key without passphrase for testing
          cat > /tmp/gpg-key-params <<EOF
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Test User
          Name-Email: test@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-key-params
          # Export the key as ASCII armored
          FINGERPRINT=$(gpg --list-keys --with-colons test@example.com | grep '^fpr' | head -1 | cut -d: -f10)
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
          gpg --armor --export-secret-keys "$FINGERPRINT" > /tmp/test-private-key.asc
          echo "GPG_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-private-key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: import_gpg
        uses: .
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}

      - name: Assert fingerprint output is set
        env:
          FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          echo "fingerprint: $FINGERPRINT"
          if [ -z "$FINGERPRINT" ]; then
            echo "FAIL: fingerprint output is empty"
            exit 1
          fi
          echo "PASS: fingerprint is set"

      - name: Assert keyid output is set
        env:
          KEYID: ${{ steps.import_gpg.outputs.keyid }}
        run: |
          echo "keyid: $KEYID"
          if [ -z "$KEYID" ]; then
            echo "FAIL: keyid output is empty"
            exit 1
          fi
          echo "PASS: keyid is set"

      - name: Assert name output is set
        env:
          NAME: ${{ steps.import_gpg.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ "$NAME" != "Test User" ]; then
            echo "FAIL: expected name 'Test User', got '$NAME'"
            exit 1
          fi
          echo "PASS: name matches"

      - name: Assert email output is set
        env:
          EMAIL: ${{ steps.import_gpg.outputs.email }}
        run: |
          echo "email: $EMAIL"
          if [ "$EMAIL" != "test@example.com" ]; then
            echo "FAIL: expected email 'test@example.com', got '$EMAIL'"
            exit 1
          fi
          echo "PASS: email matches"

      - name: Assert GPG key is importable (verify in keyring)
        env:
          FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          echo "Verifying key in GPG keyring..."
          gpg --list-keys "$FINGERPRINT"
          if [ $? -ne 0 ]; then
            echo "FAIL: key not found in GPG keyring"
            exit 1
          fi
          echo "PASS: key found in GPG keyring"
