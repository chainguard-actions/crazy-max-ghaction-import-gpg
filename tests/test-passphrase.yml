name: Test GPG key import with passphrase
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test GPG key with passphrase
        run: |
          TEST_PASSPHRASE="s3cr3t-p@ssphrase"
          # Generate a GPG key protected by a passphrase
          cat > /tmp/gpg-key-params <<EOF
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Passphrase User
          Name-Email: passphrase@example.com
          Expire-Date: 0
          Passphrase: s3cr3t-p@ssphrase
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-key-params
          FINGERPRINT=$(gpg --list-keys --with-colons passphrase@example.com | grep '^fpr' | head -1 | cut -d: -f10)
          echo "Generated key fingerprint: $FINGERPRINT"
          # Export the key as ASCII armored (it will be passphrase-protected)
          gpg --armor --export-secret-keys --pinentry-mode loopback --passphrase "$TEST_PASSPHRASE" "$FINGERPRINT" > /tmp/test-private-key-pp.asc
          echo "GPG_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-private-key-pp.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "TEST_PASSPHRASE=$TEST_PASSPHRASE" >> $GITHUB_ENV

      - id: import_gpg
        uses: .
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.TEST_PASSPHRASE }}

      - name: Assert fingerprint output is set
        env:
          FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          echo "fingerprint: $FINGERPRINT"
          if [ -z "$FINGERPRINT" ]; then
            echo "FAIL: fingerprint output is empty"
            exit 1
          fi
          echo "PASS: fingerprint is set"

      - name: Assert keyid output is set
        env:
          KEYID: ${{ steps.import_gpg.outputs.keyid }}
        run: |
          echo "keyid: $KEYID"
          if [ -z "$KEYID" ]; then
            echo "FAIL: keyid output is empty"
            exit 1
          fi
          echo "PASS: keyid is set"

      - name: Assert name output is correct
        env:
          NAME: ${{ steps.import_gpg.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ "$NAME" != "Passphrase User" ]; then
            echo "FAIL: expected name 'Passphrase User', got '$NAME'"
            exit 1
          fi
          echo "PASS: name matches"

      - name: Assert email output is correct
        env:
          EMAIL: ${{ steps.import_gpg.outputs.email }}
        run: |
          echo "email: $EMAIL"
          if [ "$EMAIL" != "passphrase@example.com" ]; then
            echo "FAIL: expected email 'passphrase@example.com', got '$EMAIL'"
            exit 1
          fi
          echo "PASS: email matches"

      - name: Assert key is importable in keyring
        env:
          FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          echo "Verifying key in GPG keyring..."
          gpg --list-keys "$FINGERPRINT"
          if [ $? -ne 0 ]; then
            echo "FAIL: key not found in GPG keyring"
            exit 1
          fi
          echo "PASS: key found in GPG keyring"
