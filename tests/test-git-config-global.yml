name: Test GPG import with global git config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test GPG key (no passphrase)
        run: |
          cat > /tmp/gpg-gen-params <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Global Config User
          Name-Email: global@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-gen-params
          FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "Generated key fingerprint: $FINGERPRINT"
          gpg --armor --export-secret-keys "$FINGERPRINT" > /tmp/test-gpg-key.asc
          echo "GPG_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-gpg-key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: import
        uses: .
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          git_config_global: 'true'
          git_user_signingkey: 'true'
          git_commit_gpgsign: 'true'
          git_committer_name: 'Global Config User'
          git_committer_email: 'global@example.com'

      - name: Assert fingerprint output is set
        env:
          FINGERPRINT: ${{ steps.import.outputs.fingerprint }}
        run: |
          echo "fingerprint: $FINGERPRINT"
          if [ -z "$FINGERPRINT" ]; then
            echo "FAIL: fingerprint output is empty"
            exit 1
          fi
          echo "PASS: fingerprint is '$FINGERPRINT'"

      - name: Assert global git signing key is configured
        run: |
          echo "Checking global git signing key config..."
          SIGNING_KEY=$(git config --global user.signingkey 2>/dev/null || echo "")
          echo "git global user.signingkey: $SIGNING_KEY"
          if [ -z "$SIGNING_KEY" ]; then
            echo "FAIL: global git user.signingkey is not set"
            exit 1
          fi
          echo "PASS: global git signing key is configured as '$SIGNING_KEY'"

      - name: Assert global git commit gpgsign is configured
        run: |
          echo "Checking global git commit.gpgsign config..."
          GPGSIGN=$(git config --global commit.gpgsign 2>/dev/null || echo "")
          echo "git global commit.gpgsign: $GPGSIGN"
          if [ "$GPGSIGN" != "true" ]; then
            echo "FAIL: global git commit.gpgsign is not 'true', got '$GPGSIGN'"
            exit 1
          fi
          echo "PASS: global git commit.gpgsign is 'true'"

      - name: Assert global git committer name is configured
        run: |
          echo "Checking global git user.name config..."
          USERNAME=$(git config --global user.name 2>/dev/null || echo "")
          echo "git global user.name: $USERNAME"
          if [ "$USERNAME" != "Global Config User" ]; then
            echo "FAIL: global git user.name is not 'Global Config User', got '$USERNAME'"
            exit 1
          fi
          echo "PASS: global git user.name is 'Global Config User'"

      - name: Assert global git committer email is configured
        run: |
          echo "Checking global git user.email config..."
          USEREMAIL=$(git config --global user.email 2>/dev/null || echo "")
          echo "git global user.email: $USEREMAIL"
          if [ "$USEREMAIL" != "global@example.com" ]; then
            echo "FAIL: global git user.email is not 'global@example.com', got '$USEREMAIL'"
            exit 1
          fi
          echo "PASS: global git user.email is 'global@example.com'"
