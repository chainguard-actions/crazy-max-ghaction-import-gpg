name: Test GPG import with trust level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test GPG key (no passphrase)
        run: |
          cat > /tmp/gpg-gen-params <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Trusted User
          Name-Email: trusted@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --gen-key /tmp/gpg-gen-params
          FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "Generated key fingerprint: $FINGERPRINT"
          gpg --armor --export-secret-keys "$FINGERPRINT" > /tmp/test-gpg-key.asc
          echo "GPG_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-gpg-key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: import
        uses: .
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          trust_level: 'ultimate'

      - name: Assert fingerprint output is set
        env:
          FINGERPRINT: ${{ steps.import.outputs.fingerprint }}
        run: |
          echo "fingerprint: $FINGERPRINT"
          if [ -z "$FINGERPRINT" ]; then
            echo "FAIL: fingerprint output is empty"
            exit 1
          fi
          echo "PASS: fingerprint is '$FINGERPRINT'"

      - name: Assert key trust level is ultimate
        env:
          FINGERPRINT: ${{ steps.import.outputs.fingerprint }}
        run: |
          echo "Checking trust level for fingerprint: $FINGERPRINT"
          # gpg --list-keys with colons: field 9 is trust level
          # 'u' = ultimate trust
          TRUST=$(gpg --list-keys --with-colons "$FINGERPRINT" 2>/dev/null | grep '^pub' | cut -d: -f2)
          echo "Trust level: $TRUST"
          if [ "$TRUST" != "u" ]; then
            echo "FAIL: expected ultimate trust ('u'), got '$TRUST'"
            exit 1
          fi
          echo "PASS: key has ultimate trust level"

      - name: Assert name output matches
        env:
          NAME: ${{ steps.import.outputs.name }}
        run: |
          echo "name: $NAME"
          if [ "$NAME" != "Trusted User" ]; then
            echo "FAIL: expected name 'Trusted User', got '$NAME'"
            exit 1
          fi
          echo "PASS"

      - name: Assert email output matches
        env:
          EMAIL: ${{ steps.import.outputs.email }}
        run: |
          echo "email: $EMAIL"
          if [ "$EMAIL" != "trusted@example.com" ]; then
            echo "FAIL: expected email 'trusted@example.com', got '$EMAIL'"
            exit 1
          fi
          echo "PASS"
